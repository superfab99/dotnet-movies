services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: moviessqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Admin@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "Admin@123",
          "-No",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  login:
    build:
      context: .
      dockerfile: ./Movies.Login/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MoviesLoginDb;User Id=sa;******;TrustServerCertificate=True;Connect Timeout=5"
      Jwt__Issuer: "Movies.Login"
      Jwt__Audience: "Movies.Client"
      Jwt__Key: "MoviesLoginJwtSecretKeyMustBeAtLeast32Chars"
    ports:
      - "5056:8080"

  api:
    build:
      context: .
      dockerfile: ./Movies.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MoviesApiDb;User Id=sa;******;TrustServerCertificate=True;Connect Timeout=5"
      Jwt__Issuer: "Movies.Login"
      Jwt__Audience: "Movies.Client"
      Jwt__Key: "MoviesLoginJwtSecretKeyMustBeAtLeast32Chars"
    ports:
      - "5057:8081"

  review:
    build:
      context: .
      dockerfile: ./Movies.Review/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MoviesReviewDb;User Id=sa;******;TrustServerCertificate=True;Connect Timeout=5"
      Jwt__Issuer: "Movies.Login"
      Jwt__Audience: "Movies.Client"
      Jwt__Key: "MoviesLoginJwtSecretKeyMustBeAtLeast32Chars"
    ports:
      - "5058:8082"

volumes:
  sqlserver-data:
